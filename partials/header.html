<header class="sticky top-0 z-40 border-b border-brand-hair bg-white/95 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
    <a href="/" class="shrink-0" aria-label="{{siteNameBn}} — হোম">
      <img src="/assets/img/logo.png" alt="KK8 Bangladesh অফিসিয়াল লোগো" width="124" height="30" class="h-[30px] w-auto">
    </a>

    <nav class="hidden lg:block" aria-label="প্রধান মেনু">
      <ul class="flex items-center">
{{nav}}
      </ul>
    </nav>

    <div class="ml-auto flex items-center gap-1.5 sm:gap-2">
      {{langSwitch}}
      <a href="/login.html" class="hidden rounded-pill border border-brand-blue px-4 py-2 text-sm font-bold text-brand-blue transition hover:bg-brand-tint sm:inline-block">লগইন</a>
      <a href="{{moneyUrl}}" rel="nofollow noopener" target="_blank"
         class="rounded-btn bg-brand-blue px-4 py-2 text-sm font-bold text-white transition hover:bg-brand-bright">রেজিস্টার</a>
      <button type="button" id="navToggle" class="rounded-base border border-brand-hair p-2 lg:hidden"
              aria-expanded="false" aria-controls="mobileNav" aria-label="মেনু খুলুন">
        <span class="block h-0.5 w-5 bg-brand-navy"></span>
        <span class="mt-1 block h-0.5 w-5 bg-brand-navy"></span>
        <span class="mt-1 block h-0.5 w-5 bg-brand-navy"></span>
      </button>
    </div>
  </div>

  <nav id="mobileNav" hidden class="border-t border-brand-hair bg-white lg:hidden" aria-label="মোবাইল মেনু">
    <ul class="mx-auto max-w-6xl px-4 py-2">
{{nav}}
    </ul>
  </nav>
</header>
