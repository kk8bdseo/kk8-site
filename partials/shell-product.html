<section class="relative overflow-hidden bg-brand-navy">
  <div class="mx-auto grid max-w-6xl md:grid-cols-[1fr_1.15fr]">
    <div class="relative z-10 flex flex-col justify-center px-4 py-10 md:py-12">
      <nav aria-label="ব্রেডক্রাম" class="mb-4 text-xs text-white/60">
        <a href="/" class="underline hover:text-white">হোম</a>
        <span aria-hidden="true"> / </span><span class="font-semibold text-white">{{page.h1}}</span>
      </nav>
      <h1 class="text-2xl font-black text-white sm:text-4xl">{{page.h1}}</h1>
      <p class="mt-3 text-base leading-bn text-white/80">{{banner.taglineBn}}</p>
      <div class="mt-6 flex flex-wrap gap-3">
        <a href="{{moneyUrl}}" rel="nofollow noopener" target="_blank" class="btn-primary">অফিসিয়াল সাইটে যান</a>
        <a href="/faq.html" class="inline-block rounded-pill border border-white/40 px-6 py-3 text-center text-base font-bold text-white transition hover:bg-white/10">সাধারণ প্রশ্ন</a>
      </div>
      <p class="mt-4 text-xs text-white/50">{{minAge}}+ · দায়িত্বশীল গেমিং · সর্বশেষ যাচাই {{lastVerified}}</p>
    </div>
    <div class="relative">
      <img src="{{banner.src}}" alt="{{banner.alt}}" width="{{banner.w}}" height="{{banner.h}}" fetchpriority="high"
           class="block h-auto w-full object-cover object-center md:h-full">
      <div class="pointer-events-none absolute inset-y-0 left-0 hidden w-1/3 bg-gradient-to-r from-brand-navy to-transparent md:block" aria-hidden="true"></div>
    </div>
  </div>
</section>

<div class="section prose-bn max-w-4xl">
{{content}}
</div>

<div class="section max-w-4xl pt-0">
  <!-- include: rg-notice -->
</div>
